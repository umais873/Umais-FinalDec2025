name: Node.js CI
'on':
  push:                                # Run workflow automatically on push
    branches:
      - main
  pull_request:                        # Run workflow on pull requests to main
    branches:
      - main
  workflow_dispatch: null              # Allows manual trigger from GitHub UI
jobs:
# ---------------------- Build & Test Job ----------------------
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}          # Run on OS defined in matrix (Ubuntu & Windows)
    strategy:
      matrix:
        os:                            # Matrix of OS to run jobs on
          - ubuntu-latest 
          - windows-latest
        node-version:                  # Multiple Node.js versions
          - 22.x
          - 20.x
          - 18.x
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node-version }}'
            
      - name: Install dependencies
        run: npm ci
        
      - name: Run test script
        run: npm test
# ---------------------- Snyk Security Scan ----------------------
  snyk-scan:
    name: Snyk Security Scan
    needs: build                       # Runs only after build job completes successfully
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies for scanning
        run: npm ci
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: '${{ secrets.SNYK_TOKEN }}'
# ---------------------- Docker Hub Login ----------------------
  docker-login:
      name: Docker Hub Login
      needs:
        - build
        - snyk-scan                    # Runs only after both build & snyk-scan complete
      runs-on: ubuntu-latest
      steps:
        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: '${{ secrets.DOCKER_USERNAME }}'
            password: '${{ secrets.DOCKER_PASSWORD }}'
